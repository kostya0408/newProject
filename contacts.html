<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="contacts.css">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>StackSquad</title>
</head>
<body>
<header class="header">
    <div class="main">
        <img src="logo.png">
        <h2>Stack Squad</h2>

    </div>

    <div class="menu">
        <a href="index.html">Головна</a>
        <a href="" class>Проекти</a>
        <a href="">Уроки</a>
        <a href="contacts.html">Контакти</a>
    </div>
</header>
<div class="fon">
<div class="mid">
    <div class="info">
        <h1>Контакти</h1>
        <p>Будемо раді поспілкуватися! Пишіть, приєднуйтесь, слідкуйте за нами в соцільних мережах.</p>
        

    </div>

    <div class="contact">
        <form class="contact-form">
            <h3>Напишіть нам</h3>

            <label for="name">Ім'я</label>
            <input type="text" id="name" placeholder="Ваше ім'я">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com">

            <label for="message">Повідомлення</label>
            <textarea id="message" placeholder="Хочу записатися на пробне заняття"></textarea>

            <button type="submit">Надіслати</button>
        </form>
    </div>
</div>
</div>
